name: GitHub Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

# Serialise runs: GitHub often fires delayed cron runs back-to-back, and two
# overlapping runs would read the same state.json and send the same email twice.
concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Restore state
        uses: actions/cache@v4
        with:
          path: state.json
          key: monitor-state-${{ github.run_number }}
          restore-keys: |
            monitor-state-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          GH_TOKEN:         ${{ secrets.GH_TOKEN }}
          EMAIL_FROM:       ${{ secrets.EMAIL_FROM }}
          EMAIL_TO:         ${{ secrets.EMAIL_TO }}
          EMAIL_PASSWORD:   ${{ secrets.EMAIL_PASSWORD }}
          GEMINI_API_KEY:   ${{ secrets.GEMINI_API_KEY }}
          MONITOR_TARGETS:  ${{ secrets.MONITOR_TARGETS }}
        run: python monitor.py
