name: GitHub Monitor

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes (GitHub Actions minimum)
  workflow_dispatch:          # lets you trigger it manually from the Actions tab

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Restore state.json from the previous run (seen event IDs + last notification time).
      # A new cache entry is saved each run using run_number; restore-keys finds the latest one.
      - name: Restore state
        uses: actions/cache@v4
        with:
          path: state.json
          key: monitor-state-${{ github.run_number }}
          restore-keys: |
            monitor-state-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          GH_TOKEN:       ${{ secrets.GH_TOKEN }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: python monitor.py
