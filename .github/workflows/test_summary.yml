name: Test Summary (End-to-End)

on:
  workflow_dispatch:
    inputs:
      count:
        description: 'Number of recent events to summarise (ignored if commit_sha is set)'
        required: false
        default: '2'
      commit_repo:
        description: 'owner/repo for a specific commit test (e.g. octocat/hello-world)'
        required: false
        default: ''
      commit_sha:
        description: 'Full SHA of a specific commit to summarise'
        required: false
        default: ''

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test
        env:
          GH_TOKEN:         ${{ secrets.GH_TOKEN }}
          EMAIL_FROM:       ${{ secrets.EMAIL_FROM }}
          EMAIL_TO:         ${{ secrets.EMAIL_TO }}
          EMAIL_PASSWORD:   ${{ secrets.EMAIL_PASSWORD }}
          GEMINI_API_KEY:   ${{ secrets.GEMINI_API_KEY }}
          MONITOR_TARGETS:  ${{ secrets.MONITOR_TARGETS }}
        run: |
          if [ -n "${{ github.event.inputs.commit_sha }}" ]; then
            python test_summary.py --commit "${{ github.event.inputs.commit_repo }}" "${{ github.event.inputs.commit_sha }}"
          else
            python test_summary.py ${{ github.event.inputs.count }}
          fi
